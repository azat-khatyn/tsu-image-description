server {
    listen 80;
    server_name _;

    # Загрузка изображений до 15 МБ (бэкенд лимитирует 10 МБ).
    client_max_body_size 15m;

    # Статика веб-интерфейса.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Проксирование API в backend-контейнер по внутренней docker-сети.
    # Переменная + resolver — ленивое разрешение имени (переживает рестарт backend).
    location ~ ^/(inference|save_description|health)$ {
        resolver 127.0.0.11 valid=30s;
        set $api http://backend:8000;
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 75s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;     # холодный старт: докачка моделей может быть долгой
        proxy_request_buffering off;     # стримим загрузку файла, не буферизуем целиком
    }
}
