services:
  archive-description-mvp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archive-description-mvp
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Archive Description MVP
      APP_VERSION: 0.1.0
      UPLOAD_DIR: /tmp/uploads
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      TOKENIZERS_PARALLELISM: "false"
      MAX_UPLOAD_SIZE_MB: "10"
      # Языковой редактор (Vikhr-Nemo-12B) отключён по умолчанию: CPU-инференс
      # 12B-модели нецелесообразен по латентности и требует ~32 ГБ RAM.
      # Включить можно так: USE_LLM_REWRITER=true docker compose up
      USE_LLM_REWRITER: "false"
      # OCR отключён в Docker: paddleocr нет в requirements.docker.txt (CPU-образ).
      # Чтобы включить — добавить paddleocr в образ и USE_OCR=true.
      USE_OCR: "false"
    volumes:
      - ./mounted_data:/mounted_data
      - hf_cache:/models/huggingface
    restart: unless-stopped

volumes:
  hf_cache:
